<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AltF2 | Buscador de Productos</title>
    <!-- Librerías externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --bg-body: #f1f5f9;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --dark-navy: #0f172a;
            --navy-surface: #1e293b;
            --excel-green: #16a34a;
            --excel-green-hover: #15803d;
            --border-color: #cbd5e1;
            --border-light: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 32px 20px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header y Logo AltF2 */
        .header-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo-icon {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
        }

        .brand-text-group {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-size: 26px;
            font-weight: 800;
            color: var(--dark-navy);
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .brand-name span {
            color: var(--primary);
        }

        .brand-subtitle {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.2px;
        }

        /* Badge de Estado */
        .status-badge {
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 9999px;
            background-color: #e0f2fe;
            color: #0369a1;
            border: 1px solid #bae6fd;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow-sm);
        }

        /* Tarjeta de Formulario de Búsqueda */
        .search-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 24px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
            margin-bottom: 24px;
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 6px;
        }

        .form-group input {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease-in-out;
            background-color: #f8fafc;
        }

        .form-group input:hover {
            border-color: #94a3b8;
        }

        .form-group input:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3.5px rgba(37, 99, 235, 0.15);
        }

        /* Botones de Acción */
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding-top: 16px;
            border-top: 1px solid var(--border-light);
        }

        .btn-group-left, .btn-group-right {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-search { 
            background-color: var(--primary); 
            color: #ffffff; 
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        }
        .btn-search:hover { background-color: var(--primary-hover); }

        .btn-clear {
            background-color: #ffffff;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }
        .btn-clear:hover { background-color: #f8fafc; color: var(--text-main); border-color: #94a3b8; }

        .btn-excel { 
            background-color: var(--excel-green); 
            color: #ffffff; 
            box-shadow: 0 2px 4px rgba(22, 163, 74, 0.2);
        }
        .btn-excel:hover { background-color: var(--excel-green-hover); }

        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Contenedor de Tabla */
        .results-card {
            background: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .results-header {
            padding: 16px 24px;
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .counter-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .table-responsive { width: 100%; overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: var(--navy-surface);
            color: #ffffff;
            padding: 14px 18px;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            white-space: nowrap;
        }

        td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-main);
        }

        tr:hover td { background-color: #f8fafc; }

        .code-badge {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            font-weight: 700;
            color: var(--dark-navy);
            background-color: #f1f5f9;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            display: inline-block;
        }

        .code-badge:hover { 
            background-color: #e2e8f0; 
            border-color: #94a3b8;
            transform: scale(1.02);
        }

        .code-badge.copied {
            background-color: #dcfce7;
            color: #15803d;
            border-color: #bbf7d0;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Encabezado con Isotipo Minimalista AltF2 -->
    <div class="header-title">
        <div class="brand-container">
            <svg class="brand-logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="48" height="48" rx="12" fill="#0F172A"/>
                <path d="M14 31V17L22 31V17" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="26" y="17" width="9" height="3" rx="1.5" fill="#2563EB"/>
                <path d="M26 24H35V26.5C35 28.9853 32.9853 31 30.5 31H26V31" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="brand-text-group">
                <div class="brand-name">Alt<span>F2</span></div>
                <div class="brand-subtitle">Buscador de Productos</div>
            </div>
        </div>
        <div id="status" class="status-badge">⏳ Conectando con la base de datos...</div>
    </div>

    <div class="search-card">
        <div class="search-grid">
            <div class="form-group">
                <label>Detalle 1 (Nombre)</label>
                <input type="text" id="det1" placeholder="Ej: PANTALON">
            </div>
            <div class="form-group">
                <label>Detalle 2 (Nombre)</label>
                <input type="text" id="det2" placeholder="Ej: BEIGE">
            </div>
            <div class="form-group">
                <label>Detalle 3 (Nombre)</label>
                <input type="text" id="det3" placeholder="Ej: XXL">
            </div>
            <div class="form-group">
                <label>Marca</label>
                <input type="text" id="marca" placeholder="Ej: OMBU">
            </div>
            <div class="form-group">
                <label>Código MyLogic</label>
                <input type="text" id="codigo" placeholder="Ej: CL-02">
            </div>
            <div class="form-group">
                <label>Código Articulo Proveedor</label>
                <input type="text" id="codAlt" placeholder="Ej: CONFECAT-01">
            </div>
        </div>

        <div class="actions-bar">
            <div class="btn-group-left">
                <button class="btn-search" onclick="filtrarProductos()">🔍 Buscar</button>
                <button class="btn-clear" onclick="limpiar()">🧹 Limpiar Filtros</button>
            </div>
            <div class="btn-group-right">
                <button class="btn-excel" id="btnExport" onclick="exportarExcel()" disabled>📊 Exportar a Excel</button>
            </div>
        </div>
    </div>

    <div class="results-card">
        <div class="results-header">
            <span class="counter-text" id="counter">Sin búsquedas activas</span>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Código Alt.</th>
                        <th>Marca</th>
                        <th>Nombre / Descripción</th>
                    </tr>
                </thead>
                <tbody id="resultadosBody">
                    <tr>
                        <td colspan="4" class="empty-state">Ingresa algún criterio y haz clic en "Buscar".</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    let productos = [];
    let resultadosActuales = [];

    // Busca un valor en el objeto p probando varios nombres de columna (ignora mayúsculas y acentos)
    function obtenerValor(obj, nombresPosibles) {
        if (!obj) return '';
        const keys = Object.keys(obj);
        
        for (let posible of nombresPosibles) {
            const posibleLimpio = posible.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
            
            for (let key of keys) {
                const keyLimpia = key.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
                if (keyLimpia === posibleLimpio || keyLimpia.includes(posibleLimpio)) {
                    const val = obj[key];
                    if (val !== undefined && val !== null) return String(val).trim();
                }
            }
        }
        return '';
    }

    // Convierte notación científica (soporta coma/punto) a texto numérico completo
    function formatearCodigo(val) {
        if (val === null || val === undefined) return '';
        let str = String(val).trim();
        if (!str) return '';

        let strNormalizado = str.replace(',', '.');
        
        if (/^[+-]?\d+(\.\d+)?e[+-]?\d+$/i.test(strNormalizado)) {
            let num = Number(strNormalizado);
            if (!isNaN(num) && isFinite(num)) {
                return num.toLocaleString('fullwide', { useGrouping: false });
            }
        }
        return str;
    }

    // Cargar automáticamente productos.csv desde GitHub
    window.onload = async function() {
        const statusDiv = document.getElementById('status');
        const urls = [
            'https://raw.githubusercontent.com/leandrocuadro/productos.csv/main/productos.csv',
            'https://cdn.jsdelivr.net/gh/leandrocuadro/productos.csv@main/productos.csv',
            './productos.csv'
        ];

        let csvText = null;
        for (let url of urls) {
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const text = await res.text();
                    if (text && text.trim().length > 0) {
                        csvText = text;
                        break;
                    }
                }
            } catch (e) {
                console.warn("No se pudo descargar desde:", url, e);
            }
        }

        if (csvText) {
            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        productos = results.data;
                        statusDiv.innerHTML = `✅ ${productos.length.toLocaleString()} productos cargados desde GitHub`;
                        statusDiv.style.backgroundColor = '#dcfce7';
                        statusDiv.style.color = '#15803d';
                        statusDiv.style.borderColor = '#bbf7d0';
                    } else {
                        mostrarError("El archivo de productos está vacío o no tiene el formato correcto.");
                    }
                },
                error: function(err) {
                    mostrarError("Error al procesar el archivo CSV: " + err.message);
                }
            });
        } else {
            mostrarError("No se pudo conectar con GitHub. Verifica tu conexión a internet o la disponibilidad del repositorio.");
        }
    };

    function mostrarError(mensaje) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = `❌ ${mensaje}`;
        statusDiv.style.backgroundColor = '#fee2e2';
        statusDiv.style.color = '#b91c1c';
        statusDiv.style.borderColor = '#fca5a5';
    }

    function filtrarProductos() {
        if (!productos || productos.length === 0) {
            alert("La base de datos aún no se ha cargado.");
            return;
        }

        const d1 = document.getElementById('det1').value.toUpperCase().trim();
        const d2 = document.getElementById('det2').value.toUpperCase().trim();
        const d3 = document.getElementById('det3').value.toUpperCase().trim();
        const marca = document.getElementById('marca').value.toUpperCase().trim();
        const cod = document.getElementById('codigo').value.toUpperCase().trim();
        const codAlt = document.getElementById('codAlt').value.toUpperCase().trim();

        resultadosActuales = productos.filter(p => {
            const rawNombre = obtenerValor(p, ['nombre', 'descripcion', 'descripción', 'detalle']);
            const rawMarca = obtenerValor(p, ['marca']);
            const rawCod = obtenerValor(p, ['código', 'codigo', 'cod']);
            const rawCodAlt = obtenerValor(p, ['código alternativo', 'codigo alternativo', 'código alt', 'codigo alt', 'cod alt']);

            const nombre = rawNombre.toUpperCase();
            const pMarca = rawMarca.toUpperCase();
            const pCod = formatearCodigo(rawCod).toUpperCase();
            const pCodAlt = formatearCodigo(rawCodAlt).toUpperCase();

            const matchD1 = !d1 || nombre.includes(d1);
            const matchD2 = !d2 || nombre.includes(d2);
            const matchD3 = !d3 || nombre.includes(d3);
            const matchMarca = !marca || pMarca.includes(marca);
            const matchCod = !cod || pCod.includes(cod);
            const matchCodAlt = !codAlt || pCodAlt.includes(codAlt);

            return matchD1 && matchD2 && matchD3 && matchMarca && matchCod && matchCodAlt;
        });

        mostrarResultados(resultadosActuales);
    }

    function copiarCodigo(elemento, texto) {
        if (!texto) return;
        navigator.clipboard.writeText(texto).then(() => {
            const originalText = elemento.innerText;
            elemento.innerText = "¡Copiado!";
            elemento.classList.add("copied");
            setTimeout(() => {
                elemento.innerText = originalText;
                elemento.classList.remove("copied");
            }, 1200);
        });
    }

    function mostrarResultados(lista) {
        const tbody = document.getElementById('resultadosBody');
        const btnExport = document.getElementById('btnExport');
        tbody.innerHTML = '';

        if (!lista || lista.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="empty-state">No se encontraron productos que coincidan con la búsqueda.</td></tr>`;
            document.getElementById('counter').innerText = 'Resultados encontrados: 0';
            btnExport.disabled = true;
            return;
        }

        btnExport.disabled = false;
        const maxResultados = 200;
        const limite = Math.min(lista.length, maxResultados);

        document.getElementById('counter').innerText = `Resultados encontrados: ${lista.length.toLocaleString()}` + 
            (lista.length > maxResultados ? ` (Mostrando los primeros ${maxResultados})` : '');

        for (let i = 0; i < limite; i++) {
            const p = lista[i];
            const rawCod = obtenerValor(p, ['código', 'codigo', 'cod']);
            const rawCodAlt = obtenerValor(p, ['código alternativo', 'codigo alternativo', 'código alt', 'codigo alt', 'cod alt']);
            const rawMarca = obtenerValor(p, ['marca']);
            const rawNombre = obtenerValor(p, ['nombre', 'descripcion', 'descripción', 'detalle']);

            const codigoTexto = formatearCodigo(rawCod);
            const codigoAltTexto = formatearCodigo(rawCodAlt);

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="code-badge" onclick="copiarCodigo(this, '${codigoTexto}')" title="Haz clic para copiar">${codigoTexto || '-'}</span></td>
                <td>${codigoAltTexto || '-'}</td>
                <td><strong>${rawMarca || '-'}</strong></td>
                <td>${rawNombre || '-'}</td>
            `;
            tbody.appendChild(tr);
        }
    }

    function exportarExcel() {
        if (!resultadosActuales || resultadosActuales.length === 0) return;

        const datosExcel = resultadosActuales.map(p => {
            const rawCod = obtenerValor(p, ['código', 'codigo', 'cod']);
            const rawCodAlt = obtenerValor(p, ['código alternativo', 'codigo alternativo', 'código alt', 'codigo alt', 'cod alt']);
            const rawMarca = obtenerValor(p, ['marca']);
            const rawNombre = obtenerValor(p, ['nombre', 'descripcion', 'descripción', 'detalle']);

            return {
                'Código': formatearCodigo(rawCod),
                'Código Alternativo': formatearCodigo(rawCodAlt),
                'Marca': rawMarca,
                'Nombre / Descripción': rawNombre
            };
        });

        const worksheet = XLSX.utils.json_to_sheet(datosExcel);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Resultados");

        const fecha = new Date().toISOString().slice(0,10);
        XLSX.writeFile(workbook, `Busqueda_Productos_${fecha}.xlsx`);
    }

    function limpiar() {
        document.getElementById('det1').value = '';
        document.getElementById('det2').value = '';
        document.getElementById('det3').value = '';
        document.getElementById('marca').value = '';
        document.getElementById('codigo').value = '';
        document.getElementById('codAlt').value = '';
        resultadosActuales = [];
        document.getElementById('btnExport').disabled = true;
        document.getElementById('counter').innerText = 'Sin búsquedas activas';
        document.getElementById('resultadosBody').innerHTML = `<tr><td colspan="4" class="empty-state">Ingresa algún criterio y haz clic en "Buscar".</td></tr>`;
    }
</script>

</body>
</html>
