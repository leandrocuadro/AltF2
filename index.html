<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AltF2 | Buscador de Productos</title>
    
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Librerías externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            /* Paleta Corporativa: Azul, Blanco y Rojo */
            --bg-body: #f1f5f9;
            --card-bg: #ffffff;
            
            /* Azules */
            --primary: #1d4ed8;
            --primary-hover: #1e40af;
            --primary-light: #eff6ff;
            --primary-border: #bfdbfe;
            --primary-glow: rgba(29, 78, 216, 0.22);
            
            --dark-navy: #091e42;
            --navy-surface: #0b1f3a;
            --navy-table-head: #0e2238;
            
            /* Rojos de Acento */
            --accent-red: #dc2626;
            --accent-red-hover: #b91c1c;
            --accent-red-light: #fef2f2;
            --accent-red-border: #fecaca;
            --accent-red-glow: rgba(220, 38, 38, 0.2);
            
            /* Acentos Complementarios */
            --excel-green: #059669;
            --excel-green-hover: #047857;
            --excel-green-light: #ecfdf5;
            --excel-green-border: #a7f3d0;
            
            /* Neutros y Bordes */
            --border-color: #cbd5e1;
            --border-light: #e2e8f0;
            --border-subtle: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            
            /* Tipografía */
            --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
            
            /* Sombras Modernas Multicapa */
            --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
            --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
            --shadow-lg: 0 16px 32px -6px rgba(15, 23, 42, 0.08), 0 6px 12px -3px rgba(15, 23, 42, 0.03);
            --shadow-card: 0 10px 30px -5px rgba(15, 23, 42, 0.06), 0 0 0 1px rgba(226, 232, 240, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(at 0% 0%, rgba(29, 78, 216, 0.04) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(220, 38, 38, 0.03) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(29, 78, 216, 0.02) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 36px 24px 48px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
        }

        /* Header y Marca AltF2 */
        .header-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 26px;
            flex-wrap: wrap;
            gap: 18px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo-icon {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            filter: drop-shadow(0 4px 8px rgba(15, 39, 74, 0.2));
            transition: transform 0.25s ease;
        }

        .brand-logo-icon:hover {
            transform: scale(1.04) rotate(-1deg);
        }

        .brand-text-group {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-size: 28px;
            font-weight: 800;
            color: var(--dark-navy);
            letter-spacing: -0.7px;
            line-height: 1.05;
            display: flex;
            align-items: baseline;
            gap: 2px;
        }

        .brand-name span {
            color: var(--accent-red);
            position: relative;
            display: inline-block;
        }

        .brand-name span::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent-red);
            border-radius: 2px;
            opacity: 0.35;
        }

        .brand-subtitle {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .brand-subtitle::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--primary);
        }

        /* Badge de Estado */
        .status-badge {
            font-size: 13px;
            font-weight: 600;
            padding: 9px 18px;
            border-radius: 9999px;
            background-color: #eff6ff;
            color: #1e40af;
            border: 1px solid #bfdbfe;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }

        .status-badge.loading {
            background-color: #eff6ff;
            color: #1d4ed8;
            border-color: #bfdbfe;
        }

        .status-badge.success {
            background-color: #ecfdf5;
            color: #065f46;
            border-color: #a7f3d0;
        }

        .status-badge.error {
            background-color: var(--accent-red-light);
            color: var(--accent-red-hover);
            border-color: var(--accent-red-border);
        }

        /* Tarjeta de Formulario de Búsqueda */
        .search-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 26px 28px;
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: var(--shadow-card);
            margin-bottom: 26px;
            position: relative;
            overflow: hidden;
        }

        /* Barra decorativa superior tricolor: Azul, Blanco, Rojo */
        .search-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3.5px;
            background: linear-gradient(90deg, var(--primary) 0%, #3b82f6 60%, var(--accent-red) 100%);
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px 20px;
            margin-bottom: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.65px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .form-group input {
            padding: 11px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            font-family: var(--font-sans);
            color: var(--text-main);
            outline: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #f8fafc;
        }

        .form-group input::placeholder {
            color: #94a3b8;
            font-size: 13px;
        }

        .form-group input:hover {
            border-color: #94a3b8;
            background-color: #ffffff;
        }

        .form-group input:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3.5px var(--primary-glow);
        }

        /* Barra de Acciones */
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            padding-top: 18px;
            border-top: 1px solid var(--border-light);
        }

        .btn-group-left, .btn-group-right {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            padding: 11px 22px;
            border: none;
            border-radius: 9px;
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        button:active {
            transform: translateY(1px);
        }

        /* Botón Buscar (Azul principal de alto impacto) */
        .btn-search { 
            background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
            color: #ffffff; 
            box-shadow: 0 3px 10px rgba(29, 78, 216, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .btn-search:hover { 
            background: linear-gradient(135deg, #1e40af 0%, #1d4ed8 100%);
            box-shadow: 0 5px 16px rgba(29, 78, 216, 0.4);
            transform: translateY(-1px);
        }

        /* Botón Limpiar (Blanco profesional con toque interactivo en Rojo) */
        .btn-clear {
            background-color: #ffffff;
            color: var(--text-muted);
            border: 1.5px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .btn-clear:hover { 
            background-color: var(--accent-red-light);
            color: var(--accent-red); 
            border-color: var(--accent-red-border);
            box-shadow: 0 3px 8px var(--accent-red-glow);
            transform: translateY(-1px);
        }

        /* Botón Excel (Verde corporativo refinado) */
        .btn-excel { 
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: #ffffff; 
            box-shadow: 0 3px 10px rgba(5, 150, 105, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-excel:hover:not(:disabled) { 
            background: linear-gradient(135deg, #047857 0%, #059669 100%);
            box-shadow: 0 5px 16px rgba(5, 150, 105, 0.35);
            transform: translateY(-1px);
        }

        button:disabled { 
            opacity: 0.45; 
            cursor: not-allowed; 
            transform: none !important; 
            box-shadow: none !important; 
        }

        /* Contenedor de Tabla y Resultados */
        .results-card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }

        .results-header {
            padding: 16px 24px;
            background: linear-gradient(to right, #ffffff, #f8fafc);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .counter-text {
            font-size: 14px;
            font-weight: 700;
            color: var(--dark-navy);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-responsive { 
            width: 100%; 
            overflow-x: auto; 
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: var(--navy-table-head);
            color: #ffffff;
            padding: 14px 20px;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.75px;
            white-space: nowrap;
            border-right: 1px solid rgba(255, 255, 255, 0.07);
        }

        th:last-child {
            border-right: none;
        }

        td {
            padding: 13px 20px;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-main);
            vertical-align: middle;
        }

        tr:nth-child(even) td {
            background-color: #fafbfd;
        }

        tr:hover td { 
            background-color: #eff6ff; 
        }

        /* Badges de Código Modernos */
        .code-badge {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 600;
            color: #1e3a8a;
            background-color: #f1f5f9;
            padding: 4px 9px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            cursor: pointer;
            user-select: none;
            transition: all 0.18s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .code-badge::after {
            content: '📋';
            font-size: 10px;
            opacity: 0.45;
            transition: opacity 0.15s ease;
        }

        .code-badge:hover { 
            background-color: #e2e8f0; 
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(29, 78, 216, 0.15);
        }

        .code-badge:hover::after {
            opacity: 1;
        }

        .code-badge.copied {
            background-color: #dcfce7 !important;
            color: #15803d !important;
            border-color: #86efac !important;
            box-shadow: 0 2px 6px rgba(22, 163, 74, 0.2);
        }

        .code-badge.copied::after {
            content: '✓';
            opacity: 1;
        }

        .brand-tag {
            font-weight: 700;
            color: var(--dark-navy);
            letter-spacing: 0.2px;
        }

        .alt-code-text {
            font-family: var(--font-mono);
            font-size: 13px;
            color: #475569;
        }

        .empty-state {
            text-align: center;
            padding: 56px 24px;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 500;
        }

        /* Responsividad */
        @media (max-width: 640px) {
            body {
                padding: 18px 12px;
            }
            .search-card {
                padding: 18px 16px;
            }
            .actions-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-group-left, .btn-group-right {
                width: 100%;
            }
            button {
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Encabezado con Isotipo y Marca AltF2 -->
    <div class="header-title">
        <div class="brand-container">
            <svg class="brand-logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="logoNavy" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#0E2238" />
                        <stop offset="1" stop-color="#091E42" />
                    </linearGradient>
                    <linearGradient id="logoRed" x1="28" y1="16" x2="38" y2="34" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#EF4444" />
                        <stop offset="1" stop-color="#DC2626" />
                    </linearGradient>
                </defs>
                <!-- Base redondeada en azul marino -->
                <rect width="48" height="48" rx="14" fill="url(#logoNavy)"/>
                <rect x="0.5" y="0.5" width="47" height="47" rx="13.5" stroke="rgba(255,255,255,0.15)"/>
                <!-- Letra A blanca / símbolo Alt -->
                <path d="M12 32L18.5 16L25 32" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M14.5 27H22.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
                <!-- F2 en rojo corporativo -->
                <rect x="29" y="16" width="8" height="3" rx="1.5" fill="url(#logoRed)"/>
                <path d="M29 22H36.5V24.2C36.5 26.2 35.2 28.1 33.3 29.1L29 32H37" stroke="url(#logoRed)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="brand-text-group">
                <div class="brand-name">Alt<span>F2</span></div>
                <div class="brand-subtitle">Buscador de Productos</div>
            </div>
        </div>
        <div id="status" class="status-badge loading">⏳ Conectando con la base de datos...</div>
    </div>

    <div class="search-card">
        <div class="search-grid">
            <div class="form-group">
                <label for="det1">Detalle 1 (Nombre)</label>
                <input type="text" id="det1" placeholder="Ej: PANTALON">
            </div>
            <div class="form-group">
                <label for="det2">Detalle 2 (Nombre)</label>
                <input type="text" id="det2" placeholder="Ej: BEIGE">
            </div>
            <div class="form-group">
                <label for="det3">Detalle 3 (Nombre)</label>
                <input type="text" id="det3" placeholder="Ej: XXL">
            </div>
            <div class="form-group">
                <label for="marca">Marca</label>
                <input type="text" id="marca" placeholder="Ej: OMBU">
            </div>
            <div class="form-group">
                <label for="codigo">Código MyLogic</label>
                <input type="text" id="codigo" placeholder="Ej: 58963412">
            </div>
            <div class="form-group">
                <label for="codAlt">Código Articulo Proveedor</label>
                <input type="text" id="codAlt" placeholder="Ej: CONFECAT-01">
            </div>
        </div>

        <div class="actions-bar">
            <div class="btn-group-left">
                <button class="btn-search" onclick="filtrarProductos()">🔍 Buscar</button>
                <button class="btn-clear" onclick="limpiar()">🧹 Limpiar Filtros</button>
            </div>
            <div class="btn-group-right">
                <button class="btn-excel" id="btnExport" onclick="exportarExcel()" disabled>📊 Exportar a Excel</button>
            </div>
        </div>
    </div>

    <div class="results-card">
        <div class="results-header">
            <span class="counter-text" id="counter">Sin búsquedas activas</span>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Código Alt.</th>
                        <th>Marca</th>
                        <th>Nombre / Descripción</th>
                    </tr>
                </thead>
                <tbody id="resultadosBody">
                    <tr>
                        <td colspan="4" class="empty-state">Ingresa algún criterio y haz clic en "Buscar" o presiona Enter.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    let productos = [];
    let resultadosActuales = [];

    // Busca un valor en el objeto p probando varios nombres de columna (ignora mayúsculas y acentos)
    function obtenerValor(obj, nombresPosibles) {
        if (!obj) return '';
        const keys = Object.keys(obj);
        
        for (let posible of nombresPosibles) {
            const posibleLimpio = posible.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
            
            for (let key of keys) {
                const keyLimpia = key.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
                if (keyLimpia === posibleLimpio || keyLimpia.includes(posibleLimpio)) {
                    const val = obj[key];
                    if (val !== undefined && val !== null) return String(val).trim();
                }
            }
        }
        return '';
    }

    // Convierte notación científica (soporta coma/punto) a texto numérico completo
    function formatearCodigo(val) {
        if (val === null || val === undefined) return '';
        let str = String(val).trim();
        if (!str) return '';

        let strNormalizado = str.replace(',', '.');
        
        if (/^[+-]?\d+(\.\d+)?e[+-]?\d+$/i.test(strNormalizado)) {
            let num = Number(strNormalizado);
            if (!isNaN(num) && isFinite(num)) {
                return num.toLocaleString('fullwide', { useGrouping: false });
            }
        }
        return str;
    }

    // Cargar automáticamente productos.csv desde GitHub o local
    window.onload = async function() {
        const statusDiv = document.getElementById('status');
        const urls = [
            'https://raw.githubusercontent.com/leandrocuadro/AltF2/main/productos.csv',
            'https://cdn.jsdelivr.net/gh/leandrocuadro/AltF2@main/productos.csv',
            './productos.csv'
        ];

        let csvText = null;
        for (let url of urls) {
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const text = await res.text();
                    if (text && text.trim().length > 0) {
                        csvText = text;
                        break;
                    }
                }
            } catch (e) {
                console.warn("No se pudo descargar desde:", url, e);
            }
        }

        if (csvText) {
            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        productos = results.data;
                        statusDiv.innerHTML = `✅ ${productos.length.toLocaleString()} productos disponibles`;
                        statusDiv.className = 'status-badge success';
                    } else {
                        mostrarError("El archivo de productos está vacío o no tiene el formato correcto.");
                    }
                },
                error: function(err) {
                    mostrarError("Error al procesar el archivo CSV: " + err.message);
                }
            });
        } else {
            mostrarError("No se pudo conectar con la base de datos. Verifica tu conexión a internet.");
        }

        // Habilitar búsqueda con la tecla Enter en cualquiera de los inputs
        const inputs = document.querySelectorAll('.search-grid input');
        inputs.forEach(input => {
            input.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    filtrarProductos();
                }
            });
        });
    };

    function mostrarError(mensaje) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = `❌ ${mensaje}`;
        statusDiv.className = 'status-badge error';
    }

    function filtrarProductos() {
        if (!productos || productos.length === 0) {
            alert("La base de datos aún no se ha cargado.");
            return;
        }

        const d1 = document.getElementById('det1').value.toUpperCase().trim();
        const d2 = document.getElementById('det2').value.toUpperCase().trim();
        const d3 = document.getElementById('det3').value.toUpperCase().trim();
        const marca = document.getElementById('marca').value.toUpperCase().trim();
        const cod = document.getElementById('codigo').value.toUpperCase().trim();
        const codAlt = document.getElementById('codAlt').value.toUpperCase().trim();

        resultadosActuales = productos.filter(p => {
            const rawNombre = obtenerValor(p, ['nombre', 'descripcion', 'descripción', 'detalle']);
            const rawMarca = obtenerValor(p, ['marca']);
            const rawCod = obtenerValor(p, ['código', 'codigo', 'cod']);
            const rawCodAlt = obtenerValor(p, ['código alternativo', 'codigo alternativo', 'código alt', 'codigo alt', 'cod alt']);

            const nombre = rawNombre.toUpperCase();
            const pMarca = rawMarca.toUpperCase();
            const pCod = formatearCodigo(rawCod).toUpperCase();
            const pCodAlt = formatearCodigo(rawCodAlt).toUpperCase();

            const matchD1 = !d1 || nombre.includes(d1);
            const matchD2 = !d2 || nombre.includes(d2);
            const matchD3 = !d3 || nombre.includes(d3);
            const matchMarca = !marca || pMarca.includes(marca);
            const matchCod = !cod || pCod.includes(cod);
            const matchCodAlt = !codAlt || pCodAlt.includes(codAlt);

            return matchD1 && matchD2 && matchD3 && matchMarca && matchCod && matchCodAlt;
        });

        mostrarResultados(resultadosActuales);
    }

    function copiarCodigo(elemento, texto) {
        if (!texto) return;
        navigator.clipboard.writeText(texto).then(() => {
            const originalText = elemento.innerText;
            elemento.innerText = "¡Copiado!";
            elemento.classList.add("copied");
            setTimeout(() => {
                elemento.innerText = originalText;
                elemento.classList.remove("copied");
            }, 1200);
        });
    }

    function mostrarResultados(lista) {
        const tbody = document.getElementById('resultadosBody');
        const btnExport = document.getElementById('btnExport');
        tbody.innerHTML = '';

        if (!lista || lista.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="empty-state">No se encontraron productos que coincidan con la búsqueda.</td></tr>`;
            document.getElementById('counter').innerText = 'Resultados encontrados: 0';
            btnExport.disabled = true;
            return;
        }

        btnExport.disabled = false;
        const maxResultados = 200;
        const limite = Math.min(lista.length, maxResultados);

        document.getElementById('counter').innerText = `Resultados encontrados: ${lista.length.toLocaleString()}` + 
            (lista.length > maxResultados ? ` (Mostrando los primeros ${maxResultados})` : '');

        for (let i = 0; i < limite; i++) {
            const p = lista[i];
            const rawCod = obtenerValor(p, ['código', 'codigo', 'cod']);
            const rawCodAlt = obtenerValor(p, ['código alternativo', 'codigo alternativo', 'código alt', 'codigo alt', 'cod alt']);
            const rawMarca = obtenerValor(p, ['marca']);
            const rawNombre = obtenerValor(p, ['nombre', 'descripcion', 'descripción', 'detalle']);

            const codigoTexto = formatearCodigo(rawCod);
            const codigoAltTexto = formatearCodigo(rawCodAlt);

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="code-badge" onclick="copiarCodigo(this, '${codigoTexto}')" title="Haz clic para copiar">${codigoTexto || '-'}</span></td>
                <td class="alt-code-text">${codigoAltTexto || '-'}</td>
                <td><span class="brand-tag">${rawMarca || '-'}</span></td>
                <td>${rawNombre || '-'}</td>
            `;
            tbody.appendChild(tr);
        }
    }

    function exportarExcel() {
        if (!resultadosActuales || resultadosActuales.length === 0) return;

        const datosExcel = resultadosActuales.map(p => {
            const rawCod = obtenerValor(p, ['código', 'codigo', 'cod']);
            const rawCodAlt = obtenerValor(p, ['código alternativo', 'codigo alternativo', 'código alt', 'codigo alt', 'cod alt']);
            const rawMarca = obtenerValor(p, ['marca']);
            const rawNombre = obtenerValor(p, ['nombre', 'descripcion', 'descripción', 'detalle']);

            return {
                'Código': formatearCodigo(rawCod),
                'Código Alternativo': formatearCodigo(rawCodAlt),
                'Marca': rawMarca,
                'Nombre / Descripción': rawNombre
            };
        });

        const worksheet = XLSX.utils.json_to_sheet(datosExcel);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Resultados");

        const fecha = new Date().toISOString().slice(0,10);
        XLSX.writeFile(workbook, `Busqueda_Productos_${fecha}.xlsx`);
    }

    function limpiar() {
        document.getElementById('det1').value = '';
        document.getElementById('det2').value = '';
        document.getElementById('det3').value = '';
        document.getElementById('marca').value = '';
        document.getElementById('codigo').value = '';
        document.getElementById('codAlt').value = '';
        resultadosActuales = [];
        document.getElementById('btnExport').disabled = true;
        document.getElementById('counter').innerText = 'Sin búsquedas activas';
        document.getElementById('resultadosBody').innerHTML = `<tr><td colspan="4" class="empty-state">Ingresa algún criterio y haz clic en "Buscar" o presiona Enter.</td></tr>`;
    }
</script>
