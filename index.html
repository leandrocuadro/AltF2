<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AltF2 | Buscador de Productos</title>
    <link rel="icon" type="image/png" href="LOGO NUEVO.png">
    
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Librerías externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            /* Paleta Corporativa: Azul, Blanco y Rojo */
            --bg-body: #f1f5f9;
            --card-bg: #ffffff;
            
            /* Azules */
            --primary: #1d4ed8;
            --primary-hover: #1e40af;
            --primary-light: #eff6ff;
            --primary-border: #bfdbfe;
            --primary-glow: rgba(29, 78, 216, 0.22);
            
            --dark-navy: #091e42;
            --navy-surface: #0b1f3a;
            --navy-table-head: #0e2238;
            
            /* Rojos de Acento */
            --accent-red: #dc2626;
            --accent-red-hover: #b91c1c;
            --accent-red-light: #fef2f2;
            --accent-red-border: #fecaca;
            --accent-red-glow: rgba(220, 38, 38, 0.2);
            
            /* Acentos Complementarios */
            --excel-green: #059669;
            --excel-green-hover: #047857;
            --excel-green-light: #ecfdf5;
            --excel-green-border: #a7f3d0;
            
            /* Neutros y Bordes */
            --border-color: #cbd5e1;
            --border-light: #e2e8f0;
            --border-subtle: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            
            /* Tipografía */
            --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
            
            /* Sombras Modernas Multicapa */
            --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
            --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
            --shadow-lg: 0 16px 32px -6px rgba(15, 23, 42, 0.08), 0 6px 12px -3px rgba(15, 23, 42, 0.03);
            --shadow-card: 0 10px 30px -5px rgba(15, 23, 42, 0.06), 0 0 0 1px rgba(226, 232, 240, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(at 0% 0%, rgba(29, 78, 216, 0.04) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(220, 38, 38, 0.03) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(29, 78, 216, 0.02) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 36px 24px 48px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
        }

        /* Header y Marca AltF2 */
        .header-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 26px;
            flex-wrap: wrap;
            gap: 18px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo-img {
            height: 56px;
            width: auto;
            max-width: 220px;
            object-fit: contain;
            mix-blend-mode: multiply;
            filter: drop-shadow(0 4px 10px rgba(15, 39, 74, 0.12));
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            user-select: none;
        }

        .brand-logo-img:hover {
            transform: scale(1.03);
        }

        .brand-text-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand-subtitle {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-subtitle::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--primary);
        }

        /* Badge de Estado */
        .status-badge {
            font-size: 13px;
            font-weight: 600;
            padding: 9px 18px;
            border-radius: 9999px;
            background-color: #eff6ff;
            color: #1e40af;
            border: 1px solid #bfdbfe;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }

        .status-badge.loading {
            background-color: #eff6ff;
            color: #1d4ed8;
            border-color: #bfdbfe;
        }

        .status-badge.success {
            background-color: #ecfdf5;
            color: #065f46;
            border-color: #a7f3d0;
        }

        .status-badge.error {
            background-color: var(--accent-red-light);
            color: var(--accent-red-hover);
            border-color: var(--accent-red-border);
        }

        /* Tarjeta de Formulario de Búsqueda */
        .search-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 26px 28px;
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: var(--shadow-card);
            margin-bottom: 26px;
            position: relative;
            overflow: hidden;
        }

        /* Barra decorativa superior tricolor: Azul, Blanco, Rojo */
        .search-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3.5px;
            background: linear-gradient(90deg, var(--primary) 0%, #3b82f6 60%, var(--accent-red) 100%);
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px 20px;
            margin-bottom: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.65px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .form-group input {
            padding: 11px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            font-family: var(--font-sans);
            color: var(--text-main);
            outline: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #f8fafc;
        }

        .form-group input::placeholder {
            color: #94a3b8;
            font-size: 13px;
        }

        .form-group input:hover {
            border-color: #94a3b8;
            background-color: #ffffff;
        }

        .form-group input:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3.5px var(--primary-glow);
        }

        /* Barra de Acciones */
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            padding-top: 18px;
            border-top: 1px solid var(--border-light);
        }

        .btn-group-left, .btn-group-right {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            padding: 11px 22px;
            border: none;
            border-radius: 9px;
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        button:active {
            transform: translateY(1px);
        }

        /* Botón Buscar (Azul principal de alto impacto) */
        .btn-search { 
            background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
            color: #ffffff; 
            box-shadow: 0 3px 10px rgba(29, 78, 216, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .btn-search:hover { 
            background: linear-gradient(135deg, #1e40af 0%, #1d4ed8 100%);
            box-shadow: 0 5px 16px rgba(29, 78, 216, 0.4);
            transform: translateY(-1px);
        }

        /* Botón Limpiar (Blanco profesional con toque interactivo en Rojo) */
        .btn-clear {
            background-color: #ffffff;
            color: var(--text-muted);
            border: 1.5px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .btn-clear:hover { 
            background-color: var(--accent-red-light);
            color: var(--accent-red); 
            border-color: var(--accent-red-border);
            box-shadow: 0 3px 8px var(--accent-red-glow);
            transform: translateY(-1px);
        }

        /* Botón Excel (Verde corporativo refinado) */
        .btn-excel { 
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: #ffffff; 
            box-shadow: 0 3px 10px rgba(5, 150, 105, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-excel:hover:not(:disabled) { 
            background: linear-gradient(135deg, #047857 0%, #059669 100%);
            box-shadow: 0 5px 16px rgba(5, 150, 105, 0.35);
            transform: translateY(-1px);
        }

        button:disabled { 
            opacity: 0.45; 
            cursor: not-allowed; 
            transform: none !important; 
            box-shadow: none !important; 
        }

        /* Contenedor de Tabla y Resultados */
        .results-card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }

        .results-header {
            padding: 16px 24px;
            background: linear-gradient(to right, #ffffff, #f8fafc);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .counter-text {
            font-size: 14px;
            font-weight: 700;
            color: var(--dark-navy);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-responsive { 
            width: 100%; 
            overflow-x: auto; 
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: var(--navy-table-head);
            color: #ffffff;
            padding: 14px 20px;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.75px;
            white-space: nowrap;
            border-right: 1px solid rgba(255, 255, 255, 0.07);
        }

        th:last-child {
            border-right: none;
        }

        td {
            padding: 13px 20px;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-main);
            vertical-align: middle;
        }

        tr:nth-child(even) td {
            background-color: #fafbfd;
        }

        tr:hover td { 
            background-color: #eff6ff; 
        }

        /* Badges de Código Modernos */
        .code-badge {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 600;
            color: #1e3a8a;
            background-color: #f1f5f9;
            padding: 4px 9px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            cursor: pointer;
            user-select: none;
            transition: all 0.18s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .code-badge::after {
            content: '📋';
            font-size: 10px;
            opacity: 0.45;
            transition: opacity 0.15s ease;
        }

        .code-badge:hover { 
            background-color: #e2e8f0; 
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(29, 78, 216, 0.15);
        }

        .code-badge:hover::after {
            opacity: 1;
        }

        .code-badge.copied {
            background-color: #dcfce7 !important;
            color: #15803d !important;
            border-color: #86efac !important;
            box-shadow: 0 2px 6px rgba(22, 163, 74, 0.2);
        }

        .code-badge.copied::after {
            content: '✓';
            opacity: 1;
        }

        .brand-tag {
            font-weight: 700;
            color: var(--dark-navy);
            letter-spacing: 0.2px;
        }

        .alt-code-text {
            font-family: var(--font-mono);
            font-size: 13px;
            color: #475569;
        }

        .empty-state {
            text-align: center;
            padding: 56px 24px;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 500;
        }

        /* Sección de Restricciones / Filtros Avanzados */
        .filters-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 12px 20px;
            padding-top: 16px;
            border-top: 1px dashed var(--border-light);
            margin-top: 18px;
        }

        .filter-check-label {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
            user-select: none;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 8px;
            border: 1.5px solid var(--border-color);
            background: #f8fafc;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }

        .filter-check-label:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
        }

        .filter-check-label input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 17px;
            height: 17px;
            border: 2px solid var(--border-color);
            border-radius: 5px;
            background: #ffffff;
            cursor: pointer;
            transition: all 0.18s ease;
            flex-shrink: 0;
            position: relative;
        }

        .filter-check-label input[type="checkbox"]:checked {
            background: var(--primary);
            border-color: var(--primary);
        }

        .filter-check-label input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            top: 1px;
            left: 4px;
            width: 5px;
            height: 9px;
            border: 2px solid #ffffff;
            border-top: none;
            border-left: none;
            transform: rotate(45deg);
        }

        .filter-check-label.active {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        /* Panel de exclusión de palabras */
        .exclusion-panel {
            display: none;
            width: 100%;
            animation: slideDown 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .exclusion-panel.visible {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .exclusion-panel label {
            font-size: 11px;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.65px;
            white-space: nowrap;
        }

        .exclusion-panel input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 9px 14px;
            border: 1.5px solid var(--accent-red-border);
            border-radius: 10px;
            font-size: 13px;
            font-family: var(--font-sans);
            color: var(--text-main);
            outline: none;
            background-color: var(--accent-red-light);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .exclusion-panel input[type="text"]:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 0 3px var(--accent-red-glow);
            background: #ffffff;
        }

        .exclusion-hint {
            font-size: 11px;
            color: var(--text-light);
            font-style: italic;
        }

        /* Controles de Paginación */
        .page-indicator {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            background: var(--primary-light);
            border: 1px solid var(--primary-border);
            padding: 4px 12px;
            border-radius: 9999px;
            letter-spacing: 0.3px;
        }

        .pagination-footer {
            padding: 16px 24px;
            background: linear-gradient(to right, #ffffff, #f8fafc);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .pagination-info {
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            flex-wrap: wrap;
        }

        .page-size-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-size-selector label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .page-size-selector select {
            padding: 5px 10px;
            border-radius: 8px;
            border: 1.5px solid var(--border-color);
            font-size: 13px;
            font-family: var(--font-sans);
            font-weight: 600;
            background: #ffffff;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .page-size-selector select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .pagination-nav {
            display: flex;
            align-items: center;
            gap: 5px;
            user-select: none;
        }

        .page-btn {
            min-width: 36px;
            height: 36px;
            padding: 0 10px;
            border-radius: 8px;
            border: 1.5px solid var(--border-color);
            background: #ffffff;
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .page-btn:hover:not(:disabled):not(.active) {
            border-color: var(--primary);
            color: var(--primary);
            background-color: var(--primary-light);
            transform: translateY(-1px);
        }

        .page-btn.active {
            background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 3px 8px var(--primary-glow);
            cursor: default;
        }

        .page-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            border-color: var(--border-light);
            background: #f8fafc;
            color: var(--text-muted);
            transform: none !important;
            box-shadow: none !important;
        }

        .page-ellipsis {
            min-width: 24px;
            text-align: center;
            color: var(--text-light);
            font-weight: 700;
            font-size: 14px;
            user-select: none;
        }

        /* Responsividad */
        @media (max-width: 640px) {
            body {
                padding: 18px 12px;
            }
            .brand-logo-img {
                height: 44px;
            }
            .search-card {
                padding: 18px 16px;
            }
            .actions-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-group-left, .btn-group-right {
                width: 100%;
            }
            button {
                flex: 1;
                justify-content: center;
            }
            .pagination-footer {
                flex-direction: column;
                align-items: center;
                gap: 12px;
                padding: 14px 12px;
            }
            .pagination-info {
                flex-direction: column;
                gap: 8px;
                text-align: center;
            }
            .pagination-nav {
                flex-wrap: wrap;
                justify-content: center;
                gap: 4px;
            }
            .page-btn {
                min-width: 32px;
                height: 32px;
                padding: 0 6px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Encabezado con Logo AltF2 -->
    <div class="header-title">
        <div class="brand-container">
            <img src="LOGO NUEVO.png" alt="AltF2 Logo" class="brand-logo-img">
            <div class="brand-text-group">
                <div class="brand-subtitle">Buscador de Productos</div>
            </div>
        </div>
        <div id="status" class="status-badge loading">⏳ Conectando con la base de datos...</div>
    </div>

    <div class="search-card">
        <div class="search-grid">
            <div class="form-group">
                <label for="det1">Detalle 1 (Nombre)</label>
                <input type="text" id="det1" placeholder="Ej: PANTALON">
            </div>
            <div class="form-group">
                <label for="det2">Detalle 2 (Nombre)</label>
                <input type="text" id="det2" placeholder="Ej: BEIGE">
            </div>
            <div class="form-group">
                <label for="det3">Detalle 3 (Nombre)</label>
                <input type="text" id="det3" placeholder="Ej: XXL">
            </div>
            <div class="form-group">
                <label for="marca">Marca</label>
                <input type="text" id="marca" placeholder="Ej: OMBU">
            </div>
            <div class="form-group">
                <label for="codigo">Código MyLogic</label>
                <input type="text" id="codigo" placeholder="Ej: 58963412">
            </div>
            <div class="form-group">
                <label for="codAlt">Código Articulo Proveedor</label>
                <input type="text" id="codAlt" placeholder="Ej: CONFECAT-01">
            </div>
        </div>

        <!-- Filtros de Restricción -->
        <div class="filters-bar">
            <label class="filter-check-label" id="labelCod8" for="chkCod8">
                <input type="checkbox" id="chkCod8" onchange="toggleFiltro('cod8', this)">
                🔢 SOLO CÓDIGO DE 8 DÍGITOS
            </label>

            <label class="filter-check-label" id="labelExcluir" for="chkExcluir">
                <input type="checkbox" id="chkExcluir" onchange="toggleFiltro('excluir', this)">
                🚫 EXCLUIR PALABRA CLAVE
            </label>

            <div class="exclusion-panel" id="exclusionPanel">
                <label for="palabrasExcluidas">Palabras a excluir:</label>
                <input type="text" id="palabrasExcluidas" placeholder="Ej: XXL; XXXL; AZUL" title="Separar múltiples palabras con ;">
                <span class="exclusion-hint">Separar con ;</span>
            </div>
        </div>

        <div class="actions-bar">
            <div class="btn-group-left">
                <button class="btn-search" onclick="filtrarProductos()">🔍 Buscar</button>
                <button class="btn-clear" onclick="limpiar()">🧹 Limpiar Filtros</button>
            </div>
            <div class="btn-group-right">
                <button class="btn-excel" id="btnExport" onclick="exportarExcel()" disabled>📊 Exportar a Excel</button>
            </div>
        </div>
    </div>

    <div class="results-card">
        <div class="results-header">
            <span class="counter-text" id="counter">Sin búsquedas activas</span>
            <span class="page-indicator" id="headerPageIndicator" style="display: none;"></span>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Código Alt.</th>
                        <th>Marca</th>
                        <th>Nombre / Descripción</th>
                    </tr>
                </thead>
                <tbody id="resultadosBody">
                    <tr>
                        <td colspan="4" class="empty-state">Ingresa algún criterio y haz clic en "Buscar" o presiona Enter.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination-footer" id="paginationFooter" style="display: none;">
            <div class="pagination-info">
                <span id="paginationRange">Mostrando 0 de 0</span>
                <div class="page-size-selector">
                    <label for="pageSizeSelect">Por página:</label>
                    <select id="pageSizeSelect" onchange="cambiarTamanoPagina(this.value)">
                        <option value="25">25</option>
                        <option value="50" selected>50</option>
                        <option value="100">100</option>
                        <option value="200">200</option>
                    </select>
                </div>
            </div>
            <div class="pagination-nav" id="paginationNav">
                <!-- Botones generados dinámicamente -->
            </div>
        </div>
    </div>

</div>

<script>
    let productos = [];
    let resultadosActuales = [];
    let paginaActual = 1;
    let tamanoPagina = 50;

    // Busca un valor en el objeto p probando varios nombres de columna (ignora mayúsculas y acentos)
    function obtenerValor(obj, nombresPosibles) {
        if (!obj) return '';
        const keys = Object.keys(obj);
        
        for (let posible of nombresPosibles) {
            const posibleLimpio = posible.toLowerCase().replace(/^\uFEFF/, '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
            
            for (let key of keys) {
                const keyLimpia = key.toLowerCase().replace(/^\uFEFF/, '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
                if (keyLimpia === posibleLimpio || keyLimpia.includes(posibleLimpio)) {
                    const val = obj[key];
                    if (val !== undefined && val !== null) return String(val).trim();
                }
            }
        }
        return '';
    }

    // Convierte notación científica (soporta coma/punto) a texto numérico completo
    function formatearCodigo(val) {
        if (val === null || val === undefined) return '';
        let str = String(val).trim();
        if (!str) return '';

        let strNormalizado = str.replace(',', '.');
        
        if (/^[+-]?\d+(\.\d+)?e[+-]?\d+$/i.test(strNormalizado)) {
            let num = Number(strNormalizado);
            if (!isNaN(num) && isFinite(num)) {
                return num.toLocaleString('fullwide', { useGrouping: false });
            }
        }
        return str;
    }

    // Cargar automáticamente productos.csv desde GitHub o local
    window.onload = async function() {
        const statusDiv = document.getElementById('status');
        const urls = [
            'https://raw.githubusercontent.com/leandrocuadro/productos.csv/refs/heads/main/productos.csv',
            'https://raw.githubusercontent.com/leandrocuadro/productos.csv/main/productos.csv',
            'https://cdn.jsdelivr.net/gh/leandrocuadro/productos.csv@main/productos.csv',
            './productos.csv'
        ];

        let csvText = null;
        for (let url of urls) {
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const text = await res.text();
                    if (text && text.trim().length > 0) {
                        csvText = text.replace(/^\uFEFF/, ''); // Eliminar BOM si está presente
                        break;
                    }
                }
            } catch (e) {
                console.warn("No se pudo descargar desde:", url, e);
            }
        }

        if (csvText) {
            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        // Filtrar posibles filas completamente vacías
                        productos = results.data.filter(p => Object.values(p).some(v => v && String(v).trim().length > 0));
                        statusDiv.innerHTML = `✅ ${productos.length.toLocaleString()} productos disponibles`;
                        statusDiv.className = 'status-badge success';
                    } else {
                        mostrarError("El archivo de productos está vacío o no tiene el formato correcto.");
                    }
                },
                error: function(err) {
                    mostrarError("Error al procesar el archivo CSV: " + err.message);
                }
            });
        } else {
            mostrarError("No se pudo conectar con la base de datos. Verifica tu conexión a internet.");
        }

        // Habilitar búsqueda con la tecla Enter en cualquiera de los inputs
        const inputs = document.querySelectorAll('.search-grid input');
        inputs.forEach(input => {
            input.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    filtrarProductos();
                }
            });
        });
    };

    function mostrarError(mensaje) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = `❌ ${mensaje}`;
        statusDiv.className = 'status-badge error';
    }

    // Toggle visual del label del filtro al activar/desactivar
    function toggleFiltro(tipo, checkbox) {
        if (tipo === 'cod8') {
            document.getElementById('labelCod8').classList.toggle('active', checkbox.checked);
        } else if (tipo === 'excluir') {
            document.getElementById('labelExcluir').classList.toggle('active', checkbox.checked);
            const panel = document.getElementById('exclusionPanel');
            panel.classList.toggle('visible', checkbox.checked);
            if (checkbox.checked) {
                document.getElementById('palabrasExcluidas').focus();
            } else {
                document.getElementById('palabrasExcluidas').value = '';
            }
        }
    }

    function filtrarProductos() {
        if (!productos || productos.length === 0) {
            alert("La base de datos aún no se ha cargado.");
            return;
        }

        const d1 = document.getElementById('det1').value.toUpperCase().trim();
        const d2 = document.getElementById('det2').value.toUpperCase().trim();
        const d3 = document.getElementById('det3').value.toUpperCase().trim();
        const marca = document.getElementById('marca').value.toUpperCase().trim();
        const cod = document.getElementById('codigo').value.toUpperCase().trim();
        const codAlt = document.getElementById('codAlt').value.toUpperCase().trim();

        // Restricción 1: Solo código de 8 dígitos numéricos
        const soloCod8 = document.getElementById('chkCod8').checked;

        // Restricción 2: Palabras excluidas (separadas por ;)
        const excluirActivo = document.getElementById('chkExcluir').checked;
        const palabrasExcluidasRaw = document.getElementById('palabrasExcluidas').value;
        const palabrasExcluidas = excluirActivo
            ? palabrasExcluidasRaw
                .split(';')
                .map(p => p.toUpperCase().trim())
                .filter(p => p.length > 0)
            : [];

        resultadosActuales = productos.filter(p => {
            const rawNombre = obtenerValor(p, ['nombre', 'descripcion', 'descripción', 'detalle']);
            const rawMarca = obtenerValor(p, ['marca']);
            const rawCod = obtenerValor(p, ['código', 'codigo', 'cod']);
            const rawCodAlt = obtenerValor(p, ['código alternativo', 'codigo alternativo', 'código alt', 'codigo alt', 'cod alt']);

            const nombre = rawNombre.toUpperCase();
            const pMarca = rawMarca.toUpperCase();
            const pCod = formatearCodigo(rawCod).toUpperCase();
            const pCodAlt = formatearCodigo(rawCodAlt).toUpperCase();

            const matchD1 = !d1 || nombre.includes(d1);
            const matchD2 = !d2 || nombre.includes(d2);
            const matchD3 = !d3 || nombre.includes(d3);
            const matchMarca = !marca || pMarca.includes(marca);
            const matchCod = !cod || pCod.includes(cod);
            const matchCodAlt = !codAlt || pCodAlt.includes(codAlt);

            // Restricción 1: el código (formateado, sin espacios) debe tener exactamente 8 dígitos
            const matchCod8 = !soloCod8 || /^\d{8}$/.test(formatearCodigo(rawCod).replace(/\s/g, ''));

            // Restricción 2: ninguna palabra excluida debe aparecer en el nombre/descripción
            const matchExcluir = palabrasExcluidas.length === 0
                || !palabrasExcluidas.some(pe => nombre.includes(pe));

            return matchD1 && matchD2 && matchD3 && matchMarca && matchCod && matchCodAlt && matchCod8 && matchExcluir;
        });

        paginaActual = 1;
        mostrarResultados(resultadosActuales);
    }

    function copiarCodigo(elemento, texto) {
        if (!texto) return;
        navigator.clipboard.writeText(texto).then(() => {
            const originalText = elemento.innerText;
            elemento.innerText = "¡Copiado!";
            elemento.classList.add("copied");
            setTimeout(() => {
                elemento.innerText = originalText;
                elemento.classList.remove("copied");
            }, 1200);
        });
    }

    function mostrarResultados(lista) {
        const tbody = document.getElementById('resultadosBody');
        const btnExport = document.getElementById('btnExport');
        const paginationFooter = document.getElementById('paginationFooter');
        const headerPageIndicator = document.getElementById('headerPageIndicator');
        tbody.innerHTML = '';

        if (!lista || lista.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="empty-state">No se encontraron productos que coincidan con la búsqueda.</td></tr>`;
            document.getElementById('counter').innerText = 'Resultados encontrados: 0';
            btnExport.disabled = true;
            if (paginationFooter) paginationFooter.style.display = 'none';
            if (headerPageIndicator) headerPageIndicator.style.display = 'none';
            return;
        }

        btnExport.disabled = false;
        const totalItems = lista.length;
        const totalPaginas = Math.ceil(totalItems / tamanoPagina);
        
        // Mantener paginaActual dentro de límites
        if (paginaActual > totalPaginas) paginaActual = totalPaginas;
        if (paginaActual < 1) paginaActual = 1;

        const inicio = (paginaActual - 1) * tamanoPagina;
        const fin = Math.min(inicio + tamanoPagina, totalItems);
        const paginaItems = lista.slice(inicio, fin);

        document.getElementById('counter').innerText = `Resultados encontrados: ${totalItems.toLocaleString('es-AR')}`;
        
        if (headerPageIndicator) {
            headerPageIndicator.innerText = `Pág. ${paginaActual} de ${totalPaginas}`;
            headerPageIndicator.style.display = 'inline-block';
        }

        for (let i = 0; i < paginaItems.length; i++) {
            const p = paginaItems[i];
            const rawCod = obtenerValor(p, ['código', 'codigo', 'cod']);
            const rawCodAlt = obtenerValor(p, ['código alternativo', 'codigo alternativo', 'código alt', 'codigo alt', 'cod alt']);
            const rawMarca = obtenerValor(p, ['marca']);
            const rawNombre = obtenerValor(p, ['nombre', 'descripcion', 'descripción', 'detalle']);

            const codigoTexto = formatearCodigo(rawCod);
            const codigoAltTexto = formatearCodigo(rawCodAlt);

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="code-badge" onclick="copiarCodigo(this, '${codigoTexto}')" title="Haz clic para copiar">${codigoTexto || '-'}</span></td>
                <td class="alt-code-text">${codigoAltTexto || '-'}</td>
                <td><span class="brand-tag">${rawMarca || '-'}</span></td>
                <td>${rawNombre || '-'}</td>
            `;
            tbody.appendChild(tr);
        }

        // Actualizar rango y controles de paginación
        document.getElementById('paginationRange').innerText = 
            `Mostrando ${(inicio + 1).toLocaleString('es-AR')} - ${fin.toLocaleString('es-AR')} de ${totalItems.toLocaleString('es-AR')}`;
        
        renderPaginacion(totalPaginas);
        if (paginationFooter) paginationFooter.style.display = 'flex';
    }

    function renderPaginacion(totalPaginas) {
        const nav = document.getElementById('paginationNav');
        nav.innerHTML = '';

        if (totalPaginas <= 1) {
            return;
        }

        // Botón Primera «
        const btnFirst = document.createElement('button');
        btnFirst.className = 'page-btn';
        btnFirst.innerHTML = '«';
        btnFirst.title = 'Primera página';
        btnFirst.disabled = paginaActual === 1;
        btnFirst.onclick = () => irAPagina(1);
        nav.appendChild(btnFirst);

        // Botón Anterior ‹
        const btnPrev = document.createElement('button');
        btnPrev.className = 'page-btn';
        btnPrev.innerHTML = '‹';
        btnPrev.title = 'Página anterior';
        btnPrev.disabled = paginaActual === 1;
        btnPrev.onclick = () => irAPagina(paginaActual - 1);
        nav.appendChild(btnPrev);

        // Calcular números de páginas visibles con elipsis
        const delta = 2; // páginas a cada lado de la actual
        const paginas = [];

        for (let i = 1; i <= totalPaginas; i++) {
            if (i === 1 || i === totalPaginas || (i >= paginaActual - delta && i <= paginaActual + delta)) {
                paginas.push(i);
            }
        }

        let ultimoNumero = 0;
        for (let p of paginas) {
            if (ultimoNumero && p - ultimoNumero > 1) {
                const elip = document.createElement('span');
                elip.className = 'page-ellipsis';
                elip.innerText = '…';
                nav.appendChild(elip);
            }

            const btnPage = document.createElement('button');
            btnPage.className = 'page-btn' + (p === paginaActual ? ' active' : '');
            btnPage.innerText = p;
            if (p !== paginaActual) {
                btnPage.onclick = () => irAPagina(p);
            }
            nav.appendChild(btnPage);

            ultimoNumero = p;
        }

        // Botón Siguiente ›
        const btnNext = document.createElement('button');
        btnNext.className = 'page-btn';
        btnNext.innerHTML = '›';
        btnNext.title = 'Página siguiente';
        btnNext.disabled = paginaActual === totalPaginas;
        btnNext.onclick = () => irAPagina(paginaActual + 1);
        nav.appendChild(btnNext);

        // Botón Última »
        const btnLast = document.createElement('button');
        btnLast.className = 'page-btn';
        btnLast.innerHTML = '»';
        btnLast.title = 'Última página';
        btnLast.disabled = paginaActual === totalPaginas;
        btnLast.onclick = () => irAPagina(totalPaginas);
        nav.appendChild(btnLast);
    }

    function irAPagina(num) {
        paginaActual = num;
        mostrarResultados(resultadosActuales);
        const resultsEl = document.querySelector('.results-card');
        if (resultsEl) {
            resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }

    function cambiarTamanoPagina(nuevoTamano) {
        tamanoPagina = parseInt(nuevoTamano, 10);
        paginaActual = 1;
        mostrarResultados(resultadosActuales);
    }

    function exportarExcel() {
        if (!resultadosActuales || resultadosActuales.length === 0) return;

        const datosExcel = resultadosActuales.map(p => {
            const rawCod = obtenerValor(p, ['código', 'codigo', 'cod']);
            const rawCodAlt = obtenerValor(p, ['código alternativo', 'codigo alternativo', 'código alt', 'codigo alt', 'cod alt']);
            const rawMarca = obtenerValor(p, ['marca']);
            const rawNombre = obtenerValor(p, ['nombre', 'descripcion', 'descripción', 'detalle']);

            return {
                'Código': formatearCodigo(rawCod),
                'Código Alternativo': formatearCodigo(rawCodAlt),
                'Marca': rawMarca,
                'Nombre / Descripción': rawNombre
            };
        });

        const worksheet = XLSX.utils.json_to_sheet(datosExcel);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Resultados");

        const fecha = new Date().toISOString().slice(0,10);
        XLSX.writeFile(workbook, `Busqueda_Productos_${fecha}.xlsx`);
    }

    function limpiar() {
        document.getElementById('det1').value = '';
        document.getElementById('det2').value = '';
        document.getElementById('det3').value = '';
        document.getElementById('marca').value = '';
        document.getElementById('codigo').value = '';
        document.getElementById('codAlt').value = '';
        // Limpiar restricciones
        const chkCod8 = document.getElementById('chkCod8');
        const chkExcluir = document.getElementById('chkExcluir');
        chkCod8.checked = false;
        chkExcluir.checked = false;
        document.getElementById('labelCod8').classList.remove('active');
        document.getElementById('labelExcluir').classList.remove('active');
        document.getElementById('exclusionPanel').classList.remove('visible');
        document.getElementById('palabrasExcluidas').value = '';
        resultadosActuales = [];
        paginaActual = 1;
        document.getElementById('pageSizeSelect').value = "50";
        document.getElementById('btnExport').disabled = true;
        document.getElementById('counter').innerText = 'Sin búsquedas activas';
        const paginationFooter = document.getElementById('paginationFooter');
        if (paginationFooter) paginationFooter.style.display = 'none';
        const headerPageIndicator = document.getElementById('headerPageIndicator');
        if (headerPageIndicator) headerPageIndicator.style.display = 'none';
        document.getElementById('resultadosBody').innerHTML = `<tr><td colspan="4" class="empty-state">Ingresa algún criterio y haz clic en "Buscar" o presiona Enter.</td></tr>`;
    }
</script>

</body>
</html>
